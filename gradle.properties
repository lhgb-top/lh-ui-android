# AndroidX 必需（Compose BOM 全家桶是 AndroidX 依赖）
android.useAndroidX=true

# Kotlin 协程/Compose 需要，避免 AGP 对 Java 8 lambda 的警告
android.enableJetifier=false

# JVM 单测走资源合并时关掉，避免无设备环境下的不必要校验
android.nonTransitiveRClass=true

# Gradle 性能
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin 代码风格
kotlin.code.style=official

# lh-ui 库版本真源（由 scripts/sync-version.mjs 从 package.json 单向同步，禁止手改）
# 各 library 模块的 versionName 与 Maven 发布坐标版本号均读它
LHUI_VERSION=0.0.1
